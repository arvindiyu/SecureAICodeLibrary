# Jekyll is used only as the GitHub Pages build wrapper.
# .nojekyll ensures static assets pass through unmodified.
# All Markdown rendering is client-side via js/markdown-loader.js.

title: "Secure AI Code Library :: Mythos-Aligned Foundation"
description: "Secure-by-Design AI Control Plane for the SDLC"

theme: jekyll-theme-minimal
show_downloads: true
google_analytics:

exclude:
  - hooks/
  - adapters/
  - .securecode/
  - Makefile
  - CONTRIBUTING.md
  - SECURITY.md
  - sbom.cdx.json
  - scripts/
  - "*.sh"
  - node_modules/
  - .github/

defaults:
  - scope: { path: "" }
    values: { layout: null }
