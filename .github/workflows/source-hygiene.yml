name: Source Hygiene

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run source hygiene lint
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          make source-hygiene 2>&1 | tee logs/source-hygiene.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-hygiene-log
          path: logs/source-hygiene.log

  mermaid-a11y:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Mermaid accessibility lint
        shell: bash
        run: |
          mkdir -p logs
          bash scripts/source-hygiene-lint.sh --mermaid-only 2>&1 | tee logs/mermaid-a11y.log
      - name: Post PR warning summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('logs/mermaid-a11y.log')
              ? fs.readFileSync('logs/mermaid-a11y.log', 'utf8').trim()
              : 'No Mermaid accessibility output was produced.';
            const warnings = log.split('\n').filter((line) => line.startsWith('WARN:'));
            const body = [
              '## Mermaid Accessibility Warnings',
              '',
              warnings.length
                ? warnings.map((line) => `- ${line.replace(/^WARN:\s*/, '')}`).join('\n')
                : 'No Mermaid accessibility warnings found.',
              '',
              '_This check is advisory and does not block merge._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
      - name: Upload Mermaid warning log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-a11y-log
          path: logs/mermaid-a11y.log
