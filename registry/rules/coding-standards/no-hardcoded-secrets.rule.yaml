metadata:
  id: no-hardcoded-secrets
  name: No Hardcoded Secrets
  description: Prohibit API keys, passwords, tokens, private keys, and connection strings in source code; require environment variables or secret managers.
  version: "1.0.0"
  tags: [secrets, credentials, api-keys, tokens, secret-management, tier0]

category: coding-standards
severity: critical
summary: "Never hardcode API keys, passwords, tokens, private keys, or connection strings in source code. Load secrets from environment variables or a secret manager (Vault, AWS Secrets Manager, Azure Key Vault). Commit .env.example only."

asvs_controls: ["2.10.4", "6.4.1"]
iso_controls: ["A.5.17", "A.8.7"]
nist_ai_rmf: ["GOVERN-1.1", "MAP-1.5"]
cwe: ["CWE-798", "CWE-259"]

mythos_alignment:
  pillar: secure-by-design
  substantiation: aligned
  roadmap_milestone: M1

sources:
  primary:
    - "OWASP ASVS v5 §2.10.4"
    - "OWASP ASVS v5 §6.4.1"
    - "CWE-798"
    - "CWE-259"
    - "ISO/IEC 27001:2022 A.5.17"
    - "NIST SP 800-218 PO.3"

scope:
  always_apply: true
  globs:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.mjs"
    - "**/*.py"
    - "**/*.java"
    - "**/*.kt"
    - "**/*.go"
    - "**/*.cs"
    - "**/*.rb"
    - "**/*.php"
    - "**/*.swift"
    - "**/*.rs"
    - "**/*.scala"
    - "**/*.ex"
    - "**/*.exs"
    - "**/*.c"
    - "**/*.cpp"
    - "**/*.cc"
    - "**/*.h"
    - "**/*.hpp"
  exclude:
    - "**/test/**"
    - "**/*.test.*"
    - "**/__tests__/**"
    - "**/.env.example"

enforcement:
  mode: blocking
  pre_commit: true
  merge_gate: true
  ci: true

content: |
  ## Principle

  No secret material — API keys, passwords, tokens, private keys, certificates, connection strings with embedded credentials — may be committed to source code, configuration files tracked by version control, or container images. Secrets must be injected at runtime via environment variables, mounted secret volumes, or retrieved from a secret manager. Only `.env.example` (with placeholder values) may be committed.

  ## Rationale

  Hardcoded secrets in version control are exposed to every developer, CI system, and contractor with repository access, and persist indefinitely in git history even after deletion. CWE-798 (Use of Hard-coded Credentials) and CWE-259 (Use of Hard-coded Password) are among the most reliably exploitable findings in security audits. OWASP ASVS §2.10.4 explicitly prohibits embedding credentials in deployable artifacts.

  Secret scanning tools (GitHub Advanced Security, TruffleHog, gitleaks) detect most common patterns but are not exhaustive. The principal control is developer discipline and code review; scanning is a safety net, not a substitute.

  Committing secrets and rotating them later is not sufficient remediation — the history must be purged (git rebase / filter-repo) and the secret must be revoked, as the git history is distributed among all clones.

  ## BAD example

  ```typescript
  // BAD: hardcoded API key
  const stripe = new Stripe('sk_live_<REDACTED_EXAMPLE>'); // pattern: sk_live_[24-char alnum]

  // BAD: hardcoded DB connection string with password
  const pool = new Pool({ connectionString: 'postgres://admin:SuperSecret@db.internal:5432/app' });
  ```

  ## GOOD example

  ```typescript
  const stripeKey = process.env.STRIPE_SECRET_KEY;
  if (!stripeKey) throw new Error('STRIPE_SECRET_KEY environment variable is required');
  const stripe = new Stripe(stripeKey);

  const pool = new Pool({
    host: process.env.DB_HOST,
    user: process.env.DB_USER,
    password: process.env.DB_PASSWORD,
    database: process.env.DB_NAME,
  });
  ```

  `.env.example` (committed, placeholder values only):
  ```
  STRIPE_SECRET_KEY=sk_test_your_key_here
  DB_HOST=localhost
  DB_USER=app
  DB_PASSWORD=change_me
  DB_NAME=app_dev
  ```

  `.env` added to `.gitignore`.

  ## Checklist

  - [ ] `.env` and all files with real credentials are in `.gitignore`
  - [ ] Only `.env.example` with placeholder values is committed
  - [ ] All secrets loaded from environment variables or a secret manager at runtime
  - [ ] CI pipeline injects secrets via encrypted environment variables, not committed files
  - [ ] Secret scanning is enabled on the repository (gitleaks, GitHub Advanced Security, or equivalent)
  - [ ] No `-----BEGIN PRIVATE KEY-----` or `-----BEGIN RSA PRIVATE KEY-----` in tracked files
  - [ ] Connection strings contain no embedded passwords
  - [ ] If a secret was accidentally committed: revoke it immediately, then purge history

  ## References

  - https://owasp.org/www-project-application-security-verification-standard/ (ASVS v5 §2.10)
  - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  - https://cwe.mitre.org/data/definitions/798.html
  - https://cwe.mitre.org/data/definitions/259.html
