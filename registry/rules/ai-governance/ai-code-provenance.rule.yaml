metadata:
  id: ai-code-provenance
  name: AI Code Provenance
  description: Every AI-generated or AI-assisted commit must carry a Co-Authored-By trailer identifying the AI tool; CI verifies the trailer is present on flagged commits; enables attribution, audit, and downstream license analysis.
  version: "1.0.0"
  tags: [ai-governance, provenance, attribution, git, supply-chain, code-generation]

category: ai-governance
severity: high

summary: "Add Co-Authored-By trailer to every AI-generated commit (e.g., Co-Authored-By: github-copilot[bot]); CI verifies trailer on AI-flagged commits; enables audit, license analysis, and supply-chain traceability. (ISO 42001 A.8.4)"

asvs_controls: ["8.2.1", "1.6.1"]
iso_controls: ["A.5.19", "A.8.15"]
iso42001_controls: ["A.8.4", "A.7.1"]
nist_ai_rmf: ["GOVERN-1.1", "GOVERN-1.6", "MAP-1.1"]
cwe: ["CWE-345", "CWE-346"]

mythos_alignment:
  pillar: supply-chain
  substantiation: aligned
  roadmap_milestone: M3

sources:
  primary:
    - "ISO/IEC 42001:2023 A.8.4"
    - "NIST AI 600-1 (2024) §2.6"
    - "NIST AI RMF GOVERN-1.6"
    - "OpenSSF Scorecard check: Signed-Releases"

scope:
  always_apply: false
  globs:
    - "**/.github/**"
    - "**/Makefile"
    - "**/.git/**"
    - "**/hooks/**"
    - "**/*.py"
    - "**/*.ts"
    - "**/*.js"
    - "**/*.go"
    - "**/*.java"

enforcement:
  mode: warning
  pre_commit: true
  merge_gate: true
  ci: true

content: |
  ## Principle

  Every commit where AI tooling (Copilot, Cursor, Claude Code, or any other AI coding assistant) generated or substantially modified the code must carry a `Co-Authored-By:` Git trailer in the commit message that identifies the AI tool used. This creates a machine-readable provenance signal in the commit history that downstream consumers—security scanners, license-compliance tools, supply-chain auditors—can parse without requiring out-of-band metadata. Pre-commit hooks and CI must verify that the trailer is present on commits flagged as AI-assisted. The AI tool identification in the trailer must use a stable, documented identity (not a generic name).

  ## Rationale

  AI-generated code raises distinct supply-chain questions that human-authored code does not: What model version generated this? What training data did it learn from? Are there copyleft concerns from the training corpus? Is this output traceable to a specific AI session for incident response? Without a provenance signal in the commit, answering these questions requires out-of-band investigation that may be impossible months or years later.

  ISO/IEC 42001 A.8.4 requires that information about AI system characteristics is made available to relevant parties. NIST AI 600-1 (2024) §2.6 identifies lack of provenance and attribution as a key GenAI risk. The `Co-Authored-By:` trailer is the lowest-friction implementation: it is natively displayed by GitHub, GitLab, and Bitbucket, and is parseable by standard `git log` tooling.

  The OpenSSF Scorecard "Signed-Releases" check is related: provenance at the commit level enables end-to-end traceability that signed releases depend on. Without commit-level provenance, a signed release attestation cannot establish whether AI-generated code was present.

  This rule is enforced by `registry/rules/precommit/ai-attribution-check.rule.yaml` (Wave 2b) which blocks merges where AI-flagged commits lack the required trailer.

  ## BAD example

  ```
  # Commit message with no AI attribution
  commit a1b2c3d4
  Author: Alice Developer <alice@example.com>
  Date:   Mon Oct 14 14:23:00 2024 +0000

      Add user authentication flow

  # Code in this commit was 80% generated by GitHub Copilot
  # No Co-Authored-By trailer; no way to identify AI involvement
  # Supply-chain auditor cannot determine AI tool, model, or session
  ```

  Red flags: no `Co-Authored-By:` trailer; AI involvement undisclosed; no way to filter AI-generated commits in `git log`; downstream license analysis is incomplete.

  ## GOOD example

  ```
  # Commit message with AI attribution trailer
  commit a1b2c3d4
  Author: Alice Developer <alice@example.com>
  Date:   Mon Oct 14 14:23:00 2024 +0000

      Add user authentication flow

      Implements JWT-based auth with refresh token rotation per
      the session-management rule. Edge cases for token expiry
      were generated with AI assistance and reviewed manually.

  Co-Authored-By: github-copilot[bot] <copilot@github.com>
  Co-Authored-By: Alice Developer <alice@example.com>

  # Pre-commit hook: detect AI tool use in session context, add trailer automatically
  # CI check: if commit message contains AI-tool signal and lacks Co-Authored-By, WARN

  # git log one-liner to find AI-assisted commits:
  # git log --grep="Co-Authored-By: copilot" --oneline
  ```

  Why this works: AI involvement is disclosed in the commit itself; trailer is machine-parseable by CI and audit tools; `git log` can filter AI-assisted commits; downstream supply-chain tools can assess AI-generated code separately.

  ## Checklist

  - [ ] A `Co-Authored-By:` trailer is added to every commit where AI generated or substantially assisted with the code.
  - [ ] The AI tool identity in the trailer uses a stable, documented format (e.g., `github-copilot[bot] <copilot@github.com>`).
  - [ ] The pre-commit hook checks for the trailer when the session context indicates AI tool use.
  - [ ] CI verifies the trailer is present on commits that carry an AI-assistance signal.
  - [ ] Git log filters for AI-assisted commits are documented in the contributing guide.
  - [ ] Downstream SBOM includes AI-provenance metadata for components built from AI-assisted commits.
  - [ ] Commit authors are not penalized for adding AI attribution—the process must be low-friction.

  ## References

  - ISO/IEC 42001:2023 A.8.4 (Information for users about AI system characteristics): https://www.iso.org/standard/81230.html
  - NIST AI 600-1 GenAI Profile (2024) §2.6: https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf
  - NIST AI RMF GOVERN-1.6: https://www.nist.gov/itl/ai-risk-management-framework
  - OpenSSF Scorecard: https://openssf.org/
  - CWE-345 Insufficient Verification of Data Authenticity: https://cwe.mitre.org/
