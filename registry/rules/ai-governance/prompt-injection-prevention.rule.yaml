metadata:
  id: prompt-injection-prevention
  name: Prompt Injection Prevention
  description: Validate and sanitize all LLM inputs; detect injection patterns; separate system prompts from user content; use constrained interfaces for high-risk flows.
  version: "1.0.0"
  tags: [ai-security, prompt-injection, jailbreak, input-validation, llm]

category: ai-governance
severity: critical

summary: "Sanitize all LLM inputs before model invocation; detect injection patterns (role-override, instruction-leakage, delimiter confusion); never concatenate user content into the system prompt; use constrained interfaces where possible. (OWASP LLM01)"

asvs_controls: ["5.1.3", "5.2.1"]
iso_controls: ["A.8.26"]
iso42001_controls: ["A.6.1", "A.9.4"]
nist_ai_rmf: ["GOVERN-1.1", "MAP-2.3", "MANAGE-2.2"]
cwe: ["CWE-77", "CWE-94", "CWE-1336"]
mitre_atlas: ["AML.T0051", "AML.T0054"]

mythos_alignment:
  pillar: ai-governance
  substantiation: aligned
  roadmap_milestone: M1

sources:
  primary:
    - "OWASP Top 10 for LLM Applications (2025) LLM01"
    - "OWASP ASVS v5 §5.2.1"
    - "NIST AI RMF GOVERN-1.1"
    - "NIST AI 600-1 (2024) §2.5"
  threat_intel:
