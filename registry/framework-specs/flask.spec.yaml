metadata:
  id: flask
  name: Flask
  version: "1.0.0"
  description: "Security spec sheet for Flask web applications. Covers SECRET_KEY management, CSRF protection via Flask-WTF, SSTI prevention, CSP via Flask-Talisman, and debug mode restrictions."
  tags: [python, flask, secret-key, csrf, ssti, csp, flask-wtf, flask-talisman]

summary: "Flask: load SECRET_KEY from env (never hardcode); enable Flask-WTF CSRF; avoid render_template_string() with user input (SSTI); add Flask-Talisman for CSP/HTTPS; disable debug mode in production. Extends input-validation-python."

applies_to:
  language: python
  framework: flask
  min_version: "3.0.0"

extends: input-validation-python

globs:
  - "app.py"
  - "wsgi.py"
  - "application.py"
  - "**/blueprints/**/*.py"
  - "**/routes/**/*.py"
  - "**/templates/**/*.html"
  - "requirements*.txt"

security_relevant_defaults:
  secret_key_required: true              # must be set; Flask raises RuntimeError if missing for sessions
  debug_mode_default: false             # default is False but AI commonly sets DEBUG=True
  csrf_protection: false                # NOT included by default — requires Flask-WTF
  template_autoescape: true             # Jinja2 auto-escapes HTML in .html templates
  render_template_string_safe: false    # render_template_string() with user input is SSTI
  session_cookie_secure: false          # default; must set SESSION_COOKIE_SECURE=True in production
  session_cookie_httponly: true         # correct default

authoritative_refs:
  - "https://flask.palletsprojects.com/en/latest/security/"
  - "https://cheatsheetseries.owasp.org/cheatsheets/Flask_Security_Cheat_Sheet.html"
  - "OWASP ASVS v5 §5.3 (Output Encoding)"
  - "OWASP ASVS v5 §3.4 (Cookie-Based Session Management)"
  - "CWE-94"

applicable_rules:
  - input-validation-python
  - auth-patterns
  - cors-security
  - cryptography-standards
  - error-handling

subagent_hints:
  coding-standards-reviewer:
    extra_checks:
      - "Scan for app.secret_key = hardcoded string — SECRET_KEY must come from os.environ"
      - "Scan for render_template_string(user_input) or render_template_string(f'{user_input}') — SSTI vector"
      - "Verify app.run(debug=True) is not in production code paths (use FLASK_DEBUG env var in dev only)"
      - "Check for Flask-WTF CSRFProtect(app) in app factory and @csrf.exempt on any route"
      - "Verify flask-talisman or equivalent CSP/HTTPS middleware is configured"
      - "Check that request.args, request.form, request.json values are validated before use (marshmallow or pydantic)"
  secure-developer-mentor:
    extra_checks:
      - "Guide Flask application factory pattern (create_app()) with proper config loading from environment"
      - "Explain Flask-Login session management security and remember_me token hardening"

content: |
  ## Flask Security Defaults

  ### SECRET_KEY Management

  Flask requires `SECRET_KEY` for session signing. It MUST come from the environment — never from source code.

  **NEVER:**
  ```python
  # BAD: hardcoded secret key (commonly generated by AI)
  app.secret_key = 'dev-secret-key'
  app.config['SECRET_KEY'] = 'change-me'
  ```

  **Correct — load from environment:**
  ```python
  # GOOD: application factory with env-loaded secret
  import os
  import secrets

  def create_app():
      app = Flask(__name__)
      secret = os.environ.get('SECRET_KEY')
      if not secret:
          raise RuntimeError("SECRET_KEY environment variable is required")
      app.config.update(
          SECRET_KEY=secret,
          SESSION_COOKIE_SECURE=True,
          SESSION_COOKIE_HTTPONLY=True,
          SESSION_COOKIE_SAMESITE='Lax',
      )
      return app
  ```

  ### CSRF Protection (Flask-WTF)

  Flask does NOT include CSRF protection. Add `Flask-WTF` with `CSRFProtect`.

  ```python
  # GOOD: global CSRF protection
  from flask_wtf.csrf import CSRFProtect

  def create_app():
      app = Flask(__name__)
      app.config['SECRET_KEY'] = os.environ['SECRET_KEY']
      csrf = CSRFProtect(app)  # protects all POST/PUT/PATCH/DELETE forms

      # For REST APIs with JSON bodies, use JWT instead and exempt:
      @csrf.exempt
      @app.route('/api/v1/data', methods=['POST'])
      @jwt_required()
      def api_data(): ...

      return app
  ```

  ### SSTI Prevention — render_template_string()

  Jinja2 auto-escapes in `.html` templates. `render_template_string()` with user-controlled input
  is a Server-Side Template Injection (SSTI) vector.

  **NEVER:**
  ```python
  # BAD: SSTI — attacker can send {{ config }} to dump secrets
  @app.route('/greet')
  def greet():
      name = request.args.get('name', '')
      return render_template_string(f'Hello {name}!')
  ```

  **Correct — use static template files:**
  ```python
  # GOOD: render from file, pass data as context
  @app.route('/greet')
  def greet():
      name = bleach.clean(request.args.get('name', ''))  # sanitize
      return render_template('greet.html', name=name)
  # templates/greet.html: <p>Hello {{ name }}!</p>  (auto-escaped)
  ```

  ### HTTPS + CSP via Flask-Talisman

  ```python
  # GOOD: Flask-Talisman for security headers
  from flask_talisman import Talisman

  csp = {
      'default-src': "'self'",
      'script-src': "'self'",
      'style-src': "'self' 'unsafe-inline'",
  }

  talisman = Talisman(
      app,
      force_https=True,
      strict_transport_security=True,
      strict_transport_security_max_age=31536000,
      content_security_policy=csp,
  )
  ```

  ## AI Antipatterns (cross-reference: docs/EXTERNAL-RESOURCES.md § Per-Framework AI Pitfalls)

  | Antipattern | Rule |
  |---|---|
  | `app.secret_key = 'dev'` hardcoded | `cryptography-standards` |
  | `render_template_string(f'{user_input}')` — SSTI — CWE-94 | `input-validation-python` |
  | `app.run(debug=True)` in production | `error-handling` |
  | Missing `CSRFProtect(app)` for form endpoints | `auth-patterns` |
  | Unvalidated `request.args` / `request.form` used in queries | `input-validation-python` |

  ## Authoritative References

  - [Flask Security Guide](https://flask.palletsprojects.com/en/latest/security/)
  - [OWASP Flask Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Flask_Security_Cheat_Sheet.html)
  - Rule: `input-validation-python` (extends)
  - Rules: `auth-patterns`, `cors-security`, `cryptography-standards`, `error-handling`
  - CWE-94 (Server-Side Template Injection)
